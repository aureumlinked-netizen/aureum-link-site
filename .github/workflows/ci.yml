name: CI

# Сайт деплоит Cloudflare Pages, а этот прогон отвечает на другой вопрос:
# собирается ли то, что уходит в main, и не появилось ли в нём формулировок,
# которых у проекта быть не может.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # Один раз живой сайт уже месяц утверждал, что токен запущен, потому что
      # исходники были исправлены, а сборка — нет. Проверяем именно то, что
      # уходит пользователю, а не то, что лежит в src.
      - name: Никаких обещаний дохода и запущенного токена
        run: |
          set -eu
          fail=0
          check() {
            if grep -rqiF "$1" out/; then
              echo "::error::в собранном сайте найдено: $1"
              grep -rliF "$1" out/ | sed 's/^/    /'
              fail=1
            fi
          }
          # Утверждения, что токен существует и продаётся
          check "token is live"
          check "buy token"
          check "токен запущен"
          check "купить токен"
          check "presale"
          check "пресейл"
          # Обещания дохода
          check "доходность"
          check "гарантированный доход"
          check "% годовых"
          check "guaranteed return"
          check "passive income"
          check "apy"
          [ "$fail" -eq 0 ] || exit 1
          echo "запрещённых формулировок нет"

      - name: Адрес на месте
        run: |
          set -eu
          grep -rqF "aureum-link.com" out/ || { echo "::error::в сборке нет aureum-link.com"; exit 1; }
          echo "адрес на месте"

      - name: Ни одной мёртвой ссылки
        run: |
          set -eu
          # Кнопка, ведущая в никуда, на проекте про проверяемость хуже
          # отсутствующей. social-links.ts не рисует незаполненные каналы,
          # эта проверка сторожит остальную разметку.
          dead=$(grep -roF 'href="#"' out/ | wc -l)
          if [ "$dead" -ne 0 ]; then
            echo "::error::мёртвых ссылок href=\"#\": $dead"
            grep -rlF 'href="#"' out/ | sed 's/^/    /'
            exit 1
          fi
          echo "мёртвых ссылок нет"

      - name: Список того, чего ещё нет, никуда не делся
        run: |
          set -eu
          # Ролик обещает: «этот список живёт на сайте, и он там останется».
          # Удалить его молча — то же самое, что соврать.
          fail=0
          grep -rqF "пока не опубликован" out/ || { echo "::error::из русской версии пропал список незакрытых пунктов"; fail=1; }
          grep -rqF "isn't published yet" out/ || { echo "::error::из английской версии пропал список незакрытых пунктов"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "список пробелов на месте"

      # Пока в первом экране стоит заглушка вместо эфира, тексты про
      # круглосуточную трансляцию — обещание, а не факт. Как только в
      # NEXT_PUBLIC_YOUTUBE_EMBED_URL появится ссылка, заглушка исчезнет и
      # предупреждение погаснет само. Тогда же это стоит превратить в ошибку.
      - name: Стрим — заглушка или эфир
        run: |
          set -eu
          if grep -rqF "Здесь будет прямая трансляция" out/; then
            echo "::warning::эфир не подключён — на первом экране заглушка, а тексты обещают трансляцию 24/7"
          else
            echo "эфир подключён"
          fi
